

spring:
  application:
    name: wjys-server
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wjys?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:wjys}
    password: ${DB_PASSWORD:wjys}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

wjys:
  security:
    jwt-secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-bytes}
    qr-secret: ${QR_SECRET:change-this-qr-secret-to-a-long-random-value}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  redis:
    enabled: ${REDIS_ENABLED:false}
  file:
    minio-enabled: ${MINIO_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:change-minio-password}
    bucket: ${MINIO_BUCKET:wjys}
    local-path: ${FILE_LOCAL_PATH:./storage}
    cleanup-cron: ${FILE_CLEANUP_CRON:0 0 * * * *}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:false}
  inspection:
    daily-generate-cron: ${INSPECTION_DAILY_CRON:0 * * * * *}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
