spring:
  datasource:
    url: jdbc:h2:mem:wjys;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

wjys:
  redis:
    enabled: false
  file:
    minio-enabled: false
    local-path: ./target/test-storage
  scheduling:
    enabled: false
