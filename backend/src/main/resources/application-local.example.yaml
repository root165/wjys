spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wjys?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: wjys
    password: change-me
  data:
    redis:
      host: localhost
      port: 6379
      password:

wjys:
  redis:
    enabled: true
  security:
    jwt-secret: replace-with-a-random-secret-at-least-32-bytes
    qr-secret: replace-with-a-random-qr-secret-at-least-32-bytes
  file:
    minio-enabled: true
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: change-minio-password
    bucket: wjys
  scheduling:
    enabled: true
  inspection:
    daily-generate-cron: 0 * * * * *
